services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-swap_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swap-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-swap_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-swap_db}?schema=public
    networks:
      - swap-net
    depends_on:
      db:
        condition: service_healthy

networks:
  swap-net:
    name: ${DOCKER_NETWORK:-swap-net}
    driver: bridge

volumes:
  postgres_data:
